<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rusty-Drizzle</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Rusty drizzle</h1>

    <canvas id="noise-canvas" width="640" height="480"></canvas>

    <div class="controls">
        <label>Size <input type="range" id="size" min="2" max="40" step="1" value="12"> <output id="size-val">12</output></label>
        <label>Speed <input type="range" id="speed" min="50" max="800" step="10" value="300"> <output id="speed-val">300</output></label>
        <label>Count <input type="range" id="count" min="20" max="800" step="10" value="300"> <output id="count-val">300</output></label>
        <label>Angle <input type="range" id="angle" min="-80" max="80" step="1" value="15"> <output id="angle-val">15°</output></label>
        <label>Width <input type="range" id="width" min="1" max="8" step="1" value="2"> <output id="width-val">2</output></label>
    </div>

    <footer class="site-footer">
        <a class="github-link" href="https://github.com/WeirdCookie/rusty-drizzle" target="_blank" rel="noopener">
            <svg class="github-icon" viewBox="0 0 16 16" aria-hidden="true">
                <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
            </svg>
            <span>rusty-drizzle on GitHub</span>
        </a>
    </footer>

    <script src="script.js" type="module"></script>

</body>
</html>
