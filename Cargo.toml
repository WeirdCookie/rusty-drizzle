[package]
name = "rusty-drizzle"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rusty-drizzle"
path = "main.rs"

[lib]
crate-type = ["cdylib"] 

[dependencies]
image = "0.25.10"
rand = "0.10.2"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ['Window', 'Document', 'HtmlCanvasElement', 'CanvasRenderingContext2d'] }
rand = "0.10.2" 

