[package]
name = "rusty-drizzle"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rusty-drizzle"
path = "main.rs"

[lib]
crate-type = ["cdylib"] # Für Wasm wichtig[reference:2]

[dependencies]
image = "0.25.10"
rand = "0.10.2"
wasm-bindgen = "0.2" # Die Brücke zwischen Rust und JS[reference:3]
web-sys = { version = "0.3", features = ['Window', 'Document', 'HtmlCanvasElement', 'CanvasRenderingContext2d'] } # Für den Zugriff auf Canvas und requestAnimationFrame[reference:4]
rand = "0.10.2" 

